[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pyyaml",
  "sounddevice",
  "httpx",
  "torch",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
voice = "voice.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
