audio:
  sample_rate: 16000
  end_of_turn_silence_ms: 1100
llm:
  base_url: http://127.0.0.1:8080/v1
  model: qwen3-8b
  temperature: 0.85
  system_prompt_path: prompts/system.txt
  world_context_path: prompts/world_context.txt
stt:
  # resident starts whisper-server with the model loaded once; use cli to
  # retain the cold per-turn whisper-cli fallback.
  mode: resident
  whisper_bin: whisper-cli
  whisper_server_bin: whisper-server
  server_host: 127.0.0.1
  server_port: 8178
  inference_path: /inference
  manage_server: true
  model_path: models/ggml-large-v3-turbo.bin
tts:
  # hybrid = F5-TTS clone (natural + cloning) with Piper fallback
  backend: hybrid
  piper_bin: piper
  voice_path: models/en_US-lessac-medium.onnx
  voices_dir: models
  clones_dir: voices/clones
  sample_rate: 22050
  # Preload F5 on Start by synthesizing and discarding a short phrase.
  # Set false for Piper-only setups where warmup is unnecessary.
  warmup_on_start: true
  length_scale: 1.08
  sentence_silence: 0.28
  noise_scale: 0.7
  noise_w_scale: 0.85
  # Optional default clone (used when no clone profile is selected):
  clone_ref_wav: voices/clones/default/ref.wav
  clone_ref_text: voices/clones/default/ref.txt
  f5_model: lucasnewman/f5-tts-mlx
  f5_steps: 8
  f5_speed: 1.0
  f5_quantization_bits: 4
vad:
  threshold: 0.5
  min_speech_ms: 250
telemetry:
  enabled: false
  # Optional JSONL event log, relative to this config file:
  log_path: ""
memory:
  # Missing memory config defaults to disabled for Phase A compatibility.
  enabled: true
  preferences_path: data/preferences.yaml
  episodic_path: data/episodic.jsonl
  max_history_messages: 24
  max_episodic_hits: 3
  max_inject_chars: 1200
tools:
  # Tools remain disabled when this section is missing.
  enabled: false
  timeout_ms: 2000
  allow_online: false
agents:
  # Off-path helper for summarizing evicted history. Missing section = off.
  # Empty helper_base_url reuses the main llama-server (no second model).
  enabled: false
  helper_base_url: ""
  helper_model: ""
  timeout_ms: 4000
